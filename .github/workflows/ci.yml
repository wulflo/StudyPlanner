name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests y verificación
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Caché de Cargo
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2

      - name: Dependencias de Cargo
        # cargo fetch trae también las dependencias de otros targets (p. ej.
        # hermit-abi), que cargo metadata necesita para la auditoría offline.
        run: cargo fetch --locked

      - name: Dependencias de sistema para Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Dependencias npm
        run: npm ci

      - name: Verificación de frontend
        run: npm run check

      - name: Sintaxis de los scripts de empaquetado
        run: |
          node --check scripts/prepare-store-msix.mjs
          node --check scripts/package-artifacts.mjs
          node --check scripts/package-release.mjs
          node --check scripts/merge-manifests.mjs

      - name: Formato de Rust
        run: cargo fmt --all -- --check

      - name: Clippy de los crates
        run: |
          cargo clippy \
            -p study-planner-core -p study-planner-store \
            -p study-planner-transfer -p study-planner-updater \
            --all-targets -- -D warnings

      - name: Clippy del host Tauri
        run: cargo clippy -p study-planner --all-targets -- -D warnings

      - name: Tests de los crates
        run: |
          cargo test \
            -p study-planner-core -p study-planner-store \
            -p study-planner-transfer -p study-planner-updater

      - name: Tests de la bóveda y el host
        run: cargo test -p study-planner

      - name: Check del host Tauri
        run: cargo check -p study-planner

      - name: Auditoría de red, permisos y secretos
        run: bash scripts/audit-network.sh

      - name: Auditoría de licencias
        run: bash scripts/audit-licenses.sh
